# ============================================================
# 파지 가능성 태그 (pickability) — 2026-08-06 STL 전수 실측
# ------------------------------------------------------------
# 방침 = 그리퍼로 못 잡는 부품은 공정 대상에서 제외한다.
#   ⭐ 단 학습에서는 빼지 않는다 — 빼면 다른 부품으로 오인해 잘못된
#      벌림으로 집으려다 손상된다(7/9 병합이 F1 0.684→0.669 전례).
#   → 학습은 전 종수 유지, 로봇 동작만 이 태그로 가른다.
#
# ✅ 그리퍼 확정 = 주강로보테크 JEGB-4285P-3MA (협력사 회신, 8/6)
#   스트로크 85mm · 개폐 0~85mm(완전히 닫힘) · 파지력 15~150N 프로그래머블
#   RS-485 + 디지털 I/O(입력5/출력3) · 위치·속도·힘 최대 15점 등록 · Self-lock
#
# 판정 기준선: 벌림 0.0~85.0mm · 조우 진입 최소 높이 5.0mm
#   ⭐ 0mm까지 닫히므로 '얇아서 못 문다'는 제약이 없다 → 실질 제약은 두 개:
#      ① 무는 변이 스트로크 85mm 안인가  ② 조우가 진입할 높이가 있는가
#   ⚠️ [미확인] = 조우(finger) 실물 두께 → 확인 후 --min-height 로 재판정
#   ✅ min_height 5~6mm 구간에서 제외 종수가 동일하고, 실측 높이 분포에
#      4.8mm와 6.0mm 사이 간극이 있어 5mm 경계는 안정적이다.
#
# 판정 전제: 부품은 빈에 **눕혀 있다**(태민님 확정 8/6).
#   무작위 적재는 안정 자세로 수렴하므로 가장 얇은 면이 바닥에 닿는다.
#   ⇒ 무는 변 = 두 번째로 작은 변 / 조우 진입 높이 = 가장 작은 변.
#   ⇒ '세워서 두께를 문다'는 경로는 이 전제에서 존재하지 않는다.
#
# ⚠️ 아래 `gripper_width_mm`(기존 값)은 방향이 섞여 작성돼 있다
#   (20종은 중간변+여유, 7종은 최소변+여유). 눕힘 전제와 어긋나는 7종은
#   티칭 때 실물로 교정할 것 — `grip_span_flat_mm`가 눕힘 기준 값이다.
# ============================================================

# 그래스프 데이터베이스 — 부품별 피킹 자세 정의
# ================================================
#
# 각 부품에 대해 그리퍼가 부품을 잡는 로컬 자세를 정의한다.
# L4에서 부품의 월드 자세(T_part_world)가 나오면:
#   T_grasp_world = T_part_world @ T_grasp_local
# 로봇은 T_grasp_world로 이동하여 피킹한다.
#
# 좌표계:
#   - 부품 로컬: 부품 중심 = 원점, STL 기준 방향
#   - approach_axis: 그리퍼 접근 방향 (부품 로컬)
#   - grasp_depth_mm: 접근 축 방향으로 진입 깊이
#
# 그리퍼 파라미터:
#   - gripper_width_mm: 그리퍼 벌림 (부품 폭에 맞춤)
#   - gripper_force_N: 파지력 (SLA 레진 손상 방지)
#
# 초기: 대표 5종 정의 → 검증 후 30종 확장
# 부품 추가 시: 아래 형식 복사 후 수정
#
# ⚠️ 실제 값은 카메라 입고 + 로봇 티칭 후 실측으로 교정 필요
# ⚠️ 현재 값은 STL bbox 기반 추정치 (초기 개발/테스트용)

# ============================================================
# HCR-10L 로봇 스펙 (한솔코에버)
# ============================================================
# ⚠️ TBD 항목은 4/14 로봇 티칭 교육 후 실측값으로 교정
robot:
  model: "HCR-10L"
  manufacturer: "Hanwha (한화로보틱스, 구 한화정밀기계)"
  dof: 6
  payload_kg: 10
  reach_mm: 1300

  # 관절 제한 (deg) — 카탈로그 기준
  joint_limits_deg:
    j1: [-360, 360]
    j2: [-360, 360]
    j3: [-160, 160]
    j4: [-360, 360]
    j5: [-360, 360]
    j6: [-360, 360]

  # 최대 속도
  max_joint_speed_deg_s: 180       # J1~J3 (카탈로그)
  max_tcp_speed_mm_s: 1000         # 카탈로그 기준

  # TCP (Tool Center Point) 오프셋 — 그리퍼 장착 후 실측 필요
  tcp_offset_mm:
    x: 0           # TBD — 4/14 교육 후 실측
    y: 0           # TBD
    z: 0           # TBD (그리퍼 끝까지 Z 거리)
    rx: 0          # TBD (deg)
    ry: 0          # TBD
    rz: 0          # TBD

  # 통신
  modbus_port: 502
  modbus_slave_id: 1
  euler_convention: "ZYX"          # Rz→Ry→Rx (modbus_server.py와 일치)
  modbus_encoding: "INT16"         # 1/10mm, 1/10deg (HCR 펜던트와 동일)
  user_registers: [130, 255]       # 사용자 사용 가능 레지스터 범위
  tcp_read_registers: [400, 405]   # 현재 TCP 좌표 읽기 (X,Y,Z,Rx,Ry,Rz)

  # 작업 영역 제한 (로봇 베이스 기준, mm) — 빈 위치에 맞춰 교정 필요
  workspace_mm:
    x: [-600, 600]     # TBD — 빈 배치 후 실측
    y: [-600, 600]     # TBD
    z: [50, 500]       # TBD — 빈 바닥 높이 ~ 최대 리트릿 높이

  # 피킹 안전 파라미터
  safety:
    max_gripper_force_N: 40        # 병렬 그리퍼 최대 (SLA 레진 보호)
    min_z_mm: 50                   # 빈 바닥 충돌 방지 최소 Z (TBD)
    approach_speed_mm_s: 50        # 접근 속도 (느리게)
    retreat_speed_mm_s: 100        # 후퇴 속도
    pick_settle_ms: 200            # 파지 후 안정화 대기 시간

# ============================================================
# 기본 그리퍼 설정
# ============================================================
defaults:
  gripper_width_mm: 40        # 기본 벌림
  gripper_force_N: 15         # SLA 레진 기본 파지력 (낮게 시작)
  approach_speed_mm_s: 50     # 접근 속도
  retreat_height_mm: 100      # 피킹 후 상승 높이
  max_grasp_attempts: 2       # 최대 재시도 횟수

# ============================================================
# 부품별 그래스프 정의
# ============================================================

  // ══ 로직 ══════════════════════════════════════════════════
  const L = {
    node(m, id) { return m.nodes.find(n => n.node_id === id) || null; },

    /** v_node_order — MAIN 엣지만 따라간 공정 순서. */
    stepOrder(m) {
      const main = m.routes.filter(r => r.kind === 'MAIN');
      const order = {};
      const roots = m.nodes.filter(n => !main.some(r => r.to === n.node_id)).map(n => n.node_id);
      roots.forEach(id => { order[id] = 0; });
      for (let i = 0; i < 50; i++) {           // 깊이 상한 = 스키마와 같다
        let moved = false;
        main.forEach(r => {
          if (order[r.from] == null) return;
          const d = order[r.from] + 1;
          if (order[r.to] == null || order[r.to] < d) { order[r.to] = d; moved = true; }
        });
        if (!moved) break;
      }
      return order;
    },

    /** v_control_menu — group_label 로 묶고 step_order 순. 서브 메뉴의 유일한 출처. */
    menu(m) {
      const ord = L.stepOrder(m);
      const by = new Map();
      m.nodes.filter(n => n.node_kind === 'STATION').forEach(n => {
        // menu_group 이 있으면 여러 공정이 한 탭으로 묶인다 (출력 · 세척)
        const label = n.menu_group || n.group_label || n.label;
        const key = label + ' ' + n.ui_kind;
        if (!by.has(key)) by.set(key, {
          menu_label: label, ui_kind: n.ui_kind,
          step_order: ord[n.node_id] == null ? 99 : ord[n.node_id],
          node_count: 0, node_ids: []
        });
        const e = by.get(key);
        e.node_count += 1; e.node_ids.push(n.node_id);
        e.step_order = Math.min(e.step_order, ord[n.node_id] == null ? 99 : ord[n.node_id]);
      });
      const rows = Array.from(by.values());
      rows.forEach(r => r.node_ids.sort());
      rows.sort((a, b) => a.step_order - b.step_order || a.menu_label.localeCompare(b.menu_label));
      return rows;
    },

    /** 반송 자원은 STATION 이 아니라 v_control_menu 에 안 들어온다. 별도 항목으로 붙인다. */
    transportMenu(m) {
      return m.transporters.length
        ? [{ menu_label: '반송', ui_kind: 'TRANSPORT', step_order: 999,
             node_count: m.transporters.length, node_ids: m.transporters.map(t => t.transporter_id) }]
        : [];
    },
    /** 제어 홈 — 공정 노드가 아니라 랜딩 화면. v_control_menu 를 카드로 펼친다. */
    homeMenu(m) {
      return [{ menu_label: '제어 홈', ui_kind: 'HOME', step_order: -1,
                node_count: L.menu(m).length, node_ids: [] }];
    },
    fullMenu(m) { return L.homeMenu(m).concat(L.menu(m), L.transportMenu(m)); },
    slug(label) { return encodeURIComponent(label.replace(/\s+/g, '-')); },

    prevMain(m, nodeId) { return m.routes.filter(r => r.kind === 'MAIN' && r.to === nodeId).map(r => r.from); },
    nextMain(m, nodeId) { return m.routes.filter(r => r.kind === 'MAIN' && r.from === nodeId).map(r => r.to); },
    prevRacks(m, nodeId) {
      return L.prevMain(m, nodeId).map(id => L.node(m, id)).filter(n => n && n.node_kind === 'RACK');
    },
    nextNodes(m, nodeId) { return L.nextMain(m, nodeId).map(id => L.node(m, id)).filter(Boolean); },

    at(m, nodeId) { return m.units.filter(u => u.node_id === nodeId); },
    qtyOf(u) { return u.contents.reduce((a, c) => a + c.qty, 0); },
    mixOf(u) { return u.contents.map(c => c.part_no + ' x' + c.qty).join(', '); },

    /** v_rack_slot — 빈 칸도 돌려준다. */
    slotsOf(m, rackId) {
      const rack = L.node(m, rackId);
      if (!rack || !rack.slots) return [];
      return rack.slots.map(s => {
        const inSlot = L.at(m, rackId).filter(u => u.slot_no === s.slot_no);
        return { slot_no: s.slot_no, capacity: s.capacity, used: inSlot.length,
                 // 배치명만으로는 안에 뭐가 들었는지 모른다 — 종수를 함께 준다
                 contents: inSlot.slice().sort((a, b) => a.pos_no - b.pos_no)
                   .map(u => u.display_id + ' (' + u.contents.length + '종)') };
      });
    },
    rackLoad(m, rackId) {
      const s = L.slotsOf(m, rackId);
      return { used: s.reduce((a, x) => a + x.used, 0),
               capacity: s.reduce((a, x) => a + x.capacity, 0), slots: s.length };
    },

    /** v_retrievable — 랙의 slot_access 규칙으로 지금 꺼낼 수 있는 것만 표시. */
    queueOf(m, rackId, slotNo) {
      const rack = L.node(m, rackId);
      const access = rack ? (rack.slot_access || 'FIFO') : 'FIFO';
      const rows = L.at(m, rackId).filter(u => u.slot_no === slotNo)
        .slice().sort((a, b) => a.pos_no - b.pos_no);
      if (!rows.length) return [];
      const pos = rows.map(r => r.pos_no);
      const pick = access === 'FIFO' ? Math.min.apply(null, pos)
                 : access === 'LIFO' ? Math.max.apply(null, pos) : null;
      return rows.map(u => Object.assign({}, u, {
        retrievable: access === 'RANDOM' ? true : u.pos_no === pick,
        total_qty: L.qtyOf(u)
      }));
    },

    // 이하 BATCH_SPLIT
    /** 파트넘버별 판정 행. 부품 ID 를 만들지 않는다 — 아직 존재하지 않는다. */
    judgeRows(m, batch, saved) {
      saved = saved || {};
      return batch.contents.map(c => {
        const s = saved[c.part_no] || {}, p = m.part[c.part_no] || {};
        const ng = s.ng == null ? 0 : s.ng;
        return { part_no: c.part_no, name: p.name || c.part_no, cad_ref: p.cad_ref || null,
                 qty: c.qty, ok: s.ok == null ? c.qty - ng : s.ok, ng: ng, reason: s.reason || '' };
      });
    },
    totals(rows) {
      return rows.reduce((a, r) => ({ qty: a.qty + r.qty, ok: a.ok + (+r.ok || 0), ng: a.ng + (+r.ng || 0) }),
                         { qty: 0, ok: 0, ng: 0 });
    },
    /** 🔴 검증은 파트별로 각각. 합계가 맞아도 파트별이 어긋나면 안 된다. */
    rowValid(r) { return (+r.ok || 0) + (+r.ng || 0) === r.qty && (+r.ng ? !!r.reason : true); },
    badRows(rows) { return rows.filter(r => !L.rowValid(r)); },

    /** 일괄 OK 대상 = 아직 손대지 않은 파트. 이미 입력한 줄은 건드리지 않는다. */
    untouched(rows, saved) {
      saved = saved || {};
      const list = rows.filter(r => saved[r.part_no] == null);
      return { kinds: list.length, qty: list.reduce((a, r) => a + r.qty, 0), parts: list };
    },
    canComplete(rows, interlockOk) { return !!rows.length && interlockOk && rows.every(L.rowValid); },

    /**
     * Split — 배치가 개별 부품으로 분해된다. outputs 에는 OK 수량만.
     * NG 는 part_scrap 으로 기록되고 unit 이 생기지 않는다.
     */
    nextGroupId(m) { m.group_seq += 1; return 'G-' + String(m.group_seq).padStart(4, '0'); },

    splitBatch(m, batch, rows, nodeId, groupId) {
      const node = L.node(m, nodeId);
      const prefix = node && node.id_prefix ? node.id_prefix : 'S';
      // 묶음을 넘겨받으면 거기에 누적한다. 없으면 새로 딴다.
      const group_id = groupId || L.nextGroupId(m);
      const born = [];
      rows.forEach(r => {
        for (let i = 0; i < (+r.ok || 0); i++) {
          m.id_counter[prefix] = (m.id_counter[prefix] || 1) + 1;
          born.push({
            unit_id: batch.unit_id + '-' + prefix + m.id_counter[prefix],
            unit_kind: 'PART', display_id: batch.display_id + '-' + prefix + m.id_counter[prefix],
            parent_display_id: batch.display_id, order_id: batch.order_id,
            node_id: nodeId, group_id: group_id, status: 'WAIT',
            contents: [{ part_no: r.part_no, qty: 1 }]
          });
        }
      });
      const ev = { kind: 'SPLIT', unit_id: batch.unit_id, node_id: nodeId, group_id: group_id,
                   outputs: rows.filter(r => +r.ok > 0).map(r => ({ part_no: r.part_no, qty: +r.ok })) };
      const scraps = rows.filter(r => +r.ng > 0).map(r => ({
        unit_id: batch.unit_id, part_no: r.part_no, qty: +r.ng,
        node_id: nodeId, reason: r.reason, source: 'MANUAL' }));

      // 배치는 소비된다. 랙의 뒤 배치를 한 칸 당긴다 (FIFO 라 2번이 1번이 된다).
      const from = { node_id: batch.node_id, slot_no: batch.slot_no, pos_no: batch.pos_no };
      m.units = m.units.filter(u => u.unit_id !== batch.unit_id);
      m.units.forEach(u => {
        if (u.node_id === from.node_id && u.slot_no === from.slot_no && u.pos_no > from.pos_no) u.pos_no -= 1;
      });
      born.forEach(b => m.units.push(b));
      const t = L.totals(rows);
      return { ok: t.ok, ng: t.ng, group_id: group_id, born: born, event: ev, scraps: scraps };
    },

    /** 묶음째 이동 — 부품 N건이 아니라 Moved 1건. */
    groups(m, nodeId) {
      const g = new Map();
      L.at(m, nodeId).filter(u => u.unit_kind === 'PART' && u.group_id).forEach(u => {
        if (!g.has(u.group_id)) g.set(u.group_id, { group_id: u.group_id, units: [] });
        g.get(u.group_id).units.push(u);
      });
      return Array.from(g.values());
    },
    /** 묶음 안을 출처 배치별로 쪼개 본다 — 여러 배치가 섞이므로 어디서 왔는지 보여야 한다. */
    groupSources(m, nodeId, groupId) {
      const by = new Map();
      L.at(m, nodeId).filter(u => u.group_id === groupId).forEach(u => {
        const src = u.parent_display_id || '?';
        if (!by.has(src)) by.set(src, { display_id: src, parts: {}, qty: 0 });
        const e = by.get(src), pn = u.contents[0].part_no;
        e.parts[pn] = (e.parts[pn] || 0) + 1; e.qty += 1;
      });
      return Array.from(by.values());
    },
    groupCount(m, nodeId, groupId) {
      return L.at(m, nodeId).filter(u => u.group_id === groupId).length;
    },
    /**
     * 묶음 정원 — 이 묶음이 통째로 들어갈 설비의 정원.
     * 분리대에서 만든 묶음은 서포트제거를 거쳐 경화기로 가므로 두 홉을 본다.
     * ponytail: "묶음이 어디서 깨지는가"가 스키마에 없어 capacity>1 로 근사한다
     *           (치수검사는 부품 하나씩이라 capacity=1 로 걸러진다).
     *           node 에 group_breaks 플래그가 생기면 그것으로 바꾼다.
     */
    groupTarget(m, nodeId) {
      const seen = {}; let front = [nodeId], best = null;
      for (let hop = 0; hop < 2; hop++) {
        const nxt = [];
        front.forEach(id => L.nextMain(m, id).forEach(t => { if (!seen[t]) { seen[t] = 1; nxt.push(t); } }));
        nxt.forEach(id => {
          const nd = L.node(m, id);
          // 설비 정원 또는 박스 정원 — 묶음이 통째로 들어가야 하는 곳이면 둘 다 제약이다
          if (nd && (nd.node_kind === 'STATION' || nd.count_by_group)) {
            const c = L.groupCapacity(nd);
            if (c > 1) best = best == null ? c : Math.min(best, c);
          }
        });
        front = nxt;
      }
      return best || 0;
    },

    moveGroup(m, groupId, fromNode, toNode) {
      const moved = m.units.filter(u => u.group_id === groupId && u.node_id === fromNode);
      moved.forEach(u => { u.node_id = toNode; u.status = 'WAIT'; });
      return { count: moved.length,
               event: { kind: 'MOVED', group_id: groupId, from_node: fromNode, to_node: toNode } };
    },

    // 이하 PART_JUDGE
    /** 대기 부품. 파트넘버로 정렬 — 같은 모양끼리 붙어 있어야 손이 덜 간다. */
    waitingParts(m, nodeId) {
      return L.at(m, nodeId).filter(u => u.unit_kind === 'PART')
        .map(u => {
          const pn = u.contents[0] ? u.contents[0].part_no : '';
          return { unit_id: u.unit_id, display_id: u.display_id, group_id: u.group_id,
                   part_no: pn, part_name: (m.part[pn] || {}).name || pn,
                   attrs: (m.part[pn] || {}).attrs || {} };
        })
        .sort((a, b) => a.part_no.localeCompare(b.part_no) || a.display_id.localeCompare(b.display_id));
    },
    /** 측정 스펙이 노드에 있으면 입력란을 띄운다. ui_kind 는 그대로 PART_JUDGE. */
    measureSpec(m, nodeId) { const n = L.node(m, nodeId); return (n && n.measure) || null; },
    inTolerance(v, attrs) {
      if (v == null || v === '' || !attrs || attrs.nominal_mm == null) return null;
      return Math.abs(+v - attrs.nominal_mm) <= (attrs.tol_mm == null ? Infinity : attrs.tol_mm);
    },
    /** 판정 기록 — append only. 사람이 뒤집으면 새 행이 쌓인다. */
    judge(m, unitId, nodeId, verdict, value, note) {
      m.judgement.push({ ts: Date.now(), unit_id: unitId, node_id: nodeId,
                         verdict: verdict, value: value || null, note: note || null, source: 'MANUAL' });
      return m.judgement[m.judgement.length - 1];
    },
    latestVerdict(m, unitId) {
      for (let i = m.judgement.length - 1; i >= 0; i--) if (m.judgement[i].unit_id === unitId) return m.judgement[i];
      return null;
    },
    /** NG 부품은 라인을 떠난다. */
    scrapPart(m, unitId, nodeId, reason) {
      const u = m.units.find(x => x.unit_id === unitId);
      if (!u) return null;
      m.units = m.units.filter(x => x.unit_id !== unitId);
      return { event: { kind: 'MOVED', unit_id: unitId, from_node: nodeId, to_node: 'EXIT-SCRAP' },
               scrap: { unit_id: unitId, part_no: u.contents[0].part_no, qty: 1,
                        node_id: nodeId, reason: reason, source: 'MANUAL' } };
    },

    /** 묶음 정원 — 경화기면 설비 용량, 트레이 랙이면 트레이 정원. */
    groupCapacity(dest) {
      if (!dest) return 0;
      return dest.group_capacity != null ? dest.group_capacity : (dest.capacity || 0);
    },
    isFree(m, node) { return L.at(m, node.node_id).length === 0; },
    occupancy(m, node) {
      return L.at(m, node.node_id).reduce((a, u) => a + (u.unit_kind === 'PART' ? 1 : L.qtyOf(u)), 0);
    },

    /** 이 랙에 담는 중인 박스. 없으면 새로 딴다 — 랙마다 따로다. */
    openBox(m, rackId) {
      m.box = m.box || {};
      if (!m.box[rackId]) {
        m.box_seq += 1;
        m.box[rackId] = { group_id: 'BOX-' + String(m.box_seq).padStart(4, '0'), items: [] };
      }
      return m.box[rackId];
    },
    /** 박스 합류 — 부품 하나씩 join_group 으로 붙는다. */
    joinBox(m, unitId, rackId) {
      const u = m.units.find(x => x.unit_id === unitId);
      if (!u) return null;
      const box = L.openBox(m, rackId);
      m.units = m.units.filter(x => x.unit_id !== unitId);
      box.items.push({ unit_id: unitId, display_id: u.display_id, part_no: u.contents[0].part_no });
      return { kind: 'MOVED', unit_id: unitId, join_group: box.group_id };
    },
    closeBox(m, rackId) {
      const done = m.box && m.box[rackId];
      if (!done || !done.items.length) return null;
      // 마감한 박스는 랙에 올라간다 — 안 그러면 어디에도 안 남고 다음 공정이 못 본다
      m.boxes = m.boxes || [];
      m.boxes.push({ group_id: done.group_id, items: done.items, node_id: rackId || null });
      delete m.box[rackId];                    // 다음 것은 담을 때 새로 열린다
      return done;
    },

    /**
     * 이 설비에 들어올 차례를 기다리는 것들.
     *   직전이 랙  = 적재분 + 그 랙에 올라간 박스
     *   직전이 작업대 = 아직 안 넘긴 묶음
     */
    inbound(m, nodeId) {
      const rows = [];
      L.prevMain(m, nodeId).forEach(id => {
        const n = L.node(m, id);
        if (!n) return;
        const push = (kind, ref, label, qty) => rows.push({
          key: kind + ':' + ref, kind: kind, ref: ref, label: label, qty: qty,
          from: n.label, from_node: id, ready: false });
        if (n.node_kind === 'RACK') {
          (m.boxes || []).filter(b => b.node_id === id)
            .forEach(b => push('BOX', b.group_id, b.group_id, b.items.length));
          L.at(m, id).slice().sort((a, b) => (a.slot_no - b.slot_no) || (a.pos_no - b.pos_no))
            .forEach(u => push('UNIT', u.unit_id, u.display_id, L.qtyOf(u)));
        } else {
          L.groups(m, id).forEach(g => push('GROUP', g.group_id, g.group_id, g.units.length));
        }
      });
      // FIFO — 출처마다 맨 앞 것만 지금 넣을 수 있다
      const seen = {};
      rows.forEach(r => { if (!seen[r.from_node]) { seen[r.from_node] = 1; r.ready = true; } });
      return rows;
    },

    /** 랙에서 하나를 빼면 뒤엣것이 한 칸 당겨진다 (FIFO 라 번호가 밀린다). */
    pullFromRack(m, u) {
      if (u.slot_no == null) return;
      const from = { node_id: u.node_id, slot_no: u.slot_no, pos_no: u.pos_no };
      m.units.forEach(x => {
        if (x !== u && x.node_id === from.node_id && x.slot_no === from.slot_no && x.pos_no > from.pos_no) {
          x.pos_no -= 1;
        }
      });
      u.slot_no = null; u.pos_no = null;
    },

    /** 대기 큐에서 골라 설비에 넣는다. 차 있으면 못 넣는다. */
    loadInto(m, nodeId, key) {
      const dest = L.node(m, nodeId);
      if (!dest || !L.isFree(m, dest)) return null;
      const row = L.inbound(m, nodeId).find(r => r.key === key);
      if (!row || !row.ready) return null;

      let count = 0;
      if (row.kind === 'GROUP') {
        count = L.moveGroup(m, row.ref, row.from_node, nodeId).count;
      } else if (row.kind === 'UNIT') {
        const u = m.units.find(x => x.unit_id === row.ref);
        if (!u) return null;
        L.pullFromRack(m, u);
        u.node_id = nodeId; u.status = 'WAIT'; u.elapsed_s = 0; u.plan_s = null;
        count = L.qtyOf(u);
      } else {                                   // BOX — 담겨 있던 부품이 설비로 들어간다
        const bi = (m.boxes || []).findIndex(b => b.group_id === row.ref);
        if (bi < 0) return null;
        const box = m.boxes[bi];
        box.items.forEach(it => m.units.push({
          unit_id: it.unit_id, unit_kind: 'PART', display_id: it.display_id,
          order_id: it.order_id || null, node_id: nodeId, group_id: box.group_id,
          status: 'WAIT', elapsed_s: 0, contents: [{ part_no: it.part_no, qty: 1 }]
        }));
        count = box.items.length;
        m.boxes.splice(bi, 1);
      }
      return { count: count, label: row.label,
               event: { kind: 'MOVED', node_id: nodeId, from_node: row.from_node,
                        ref: row.ref, source: 'MANUAL' } };
    },

    /**
     * 설비 명령 — 시작 · 중지 · 완료.
     * 실린 것이 없으면 아무 명령도 못 준다 (빈 설비를 돌릴 수는 없다).
     * ponytail: 상태 전이표를 따로 두지 않고 세 줄로 적는다. 명령이 늘면 그때 표로.
     */
    CMD: [{ key: 'start', label: '시작', to: 'RUN' },
          { key: 'stop',  label: '중지', to: 'HOLD' },
          { key: 'done',  label: '완료', to: 'DONE' }],
    cmdOf(key) { return L.CMD.find(c => c.key === key) || null; },
    /** 시작할 때 가동 시간을 받는 설비인가. measure 스펙과 같은 방식 — 노드가 정한다. */
    durationSpec(m, nodeId) {
      const n = L.node(m, nodeId);
      if (!n || !n.duration_input) return null;
      return { label: '가동 시간', unit: '분',
               default: Math.max(1, Math.round((n.std_cycle_s || 0) / 60)) };
    },
    canCmd(m, nodeId, key) {
      const u = L.at(m, nodeId)[0];
      if (!u) return false;
      if (key === 'start') return u.status !== 'RUN';
      if (key === 'stop')  return u.status === 'RUN';
      if (key === 'done')  return u.status === 'RUN' || u.status === 'HOLD';
      return false;
    },
    runCmd(m, nodeId, key, minutes) {
      if (!L.canCmd(m, nodeId, key)) return null;
      const here = L.at(m, nodeId), u = here[0], c = L.cmdOf(key), from = u.status;
      let plan_s = null;
      if (key === 'start') {
        const spec = L.durationSpec(m, nodeId);
        if (spec) {
          const min = Math.round(+minutes);
          if (!(min > 0)) return null;          // 시간을 안 정하면 돌리지 않는다
          plan_s = min * 60;
        }
      }
      here.forEach(x => {
        x.status = c.to;
        if (key === 'start') {
          if (plan_s) x.plan_s = plan_s;
          if (x.elapsed_s == null) x.elapsed_s = 0;
        }
      });
      return { kind: 'CMD', node_id: nodeId, unit_ids: here.map(x => x.unit_id), cmd: key,
               from: from, to: c.to, plan_s: u.plan_s || null, source: 'MANUAL' };
    },
    /** 이 설비가 얼마나 돌기로 되어 있나 — 시작할 때 정한 값이 있으면 그것, 없으면 표준. */
    runTotal(m, node) {
      const u = L.at(m, node.node_id)[0];
      return (u && u.plan_s) || node.std_cycle_s || 0;
    },
    /** 블록 머리의 상태 뱃지. 비어 있으면 unit 이 없다. */
    stateBadge(m, nodeId) {
      const u = L.at(m, nodeId)[0];
      if (!u) return { text: '비어 있음', tone: 'gh' };
      return ({ RUN:   { text: '가동 중', tone: 'tl' },
                WAIT:  { text: '대기',    tone: '' },
                DONE:  { text: '완료',    tone: '' },
                HOLD:  { text: '정지',    tone: 'man' },
                ERROR: { text: '이상',    tone: 'man' } })[u.status] || { text: u.status, tone: '' };
    },

    interlockOf(m, nodeId) { return m.interlock[nodeId] || []; },
    interlockOk(m, nodeId) { return L.interlockOf(m, nodeId).every(i => i.ok); },

    fmt(s) {
      if (s == null) return '-';
      const mm = Math.floor(s / 60), ss = s % 60;
      return mm > 0 ? (ss ? mm + '분 ' + ss + '초' : mm + '분') : ss + '초';
    },
    progress(m, node) {
      const u = L.at(m, node.node_id)[0];
      const total = L.runTotal(m, node);
      if (!u || !total || u.elapsed_s == null) return null;
      return Math.min(100, Math.round(100 * u.elapsed_s / total));
    }
  };

  // 대기 큐 예시 — 앞 공정에서 이미 마감돼 랙에 올라가 있는 박스들.
  //   한 박스에 파트넘버가 섞여 있는 것이 기본이다 (앞 배치들이 함께 담긴다).
  [['BOX-0038', 'RK-CUR-WAIT-01', 'P5-W5', [['PN-A-2026', 7], ['PN-B-1180', 5]]],
   ['BOX-0039', 'RK-CUR-WAIT-01', 'P6-W6', [['PN-C-770', 6], ['PN-A-2026', 3]]],
   ['BOX-0040', 'RK-BPD-WAIT-01', 'P3-W3', [['PN-A-2026', 8], ['PN-C-770', 4]]],
   ['BOX-0041', 'RK-BPD-WAIT-01', 'P4-W4', [['PN-B-1180', 7]]]]
    .forEach(([id, rack, src, mix]) => {
      const items = []; let no = 0;
      mix.forEach(([pn, qty]) => {
        for (let i = 0; i < qty; i++) {
          no += 1;
          items.push({ unit_id: id.toLowerCase() + '-' + no,
                       display_id: src + '-S' + no, part_no: pn });
        }
      });
      MOCK.boxes.push({ group_id: id, node_id: rack, items: items });
    });

  MOCK.judgement = MOCK.judgement || [];
  const API = { MOCK: MOCK, L: L };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  else root.CTL = API;

})(typeof window !== 'undefined' ? window : this);
</script>

<script data-ctl-view>
/* ══════════════════════════════════════════════════════════════
   제어 화면 — 렌더. ui_kind 로만 분기한다 (node_type 으로 분기하지 않는다).
   ══════════════════════════════════════════════════════════════ */
(function () {
  const { MOCK: M, L } = window.CTL;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // 화면 상태. 노드 개수를 가정하지 않는다.
  const S = { menu: null, node: null, rack: null, slot: null, open: null,
              judge: {}, verdict: {}, measure: {},
              pick: null,            // 투입 대기 큐에서 고른 것
              openGroup: null };   // 누적 중인 묶음. null 이면 다음 배치가 새 묶음을 연다

  function log(kind, text) {
    const d = new Date();
    M.log.unshift({ ts: String(d.getHours()).padStart(2, '0') + ':' +
                        String(d.getMinutes()).padStart(2, '0'),
                    actor: '담당자', kind: kind, text: text });
    M.log = M.log.slice(0, 8);
  }

  // ── 확인 다이얼로그 ──
  let onYes = null;
  function confirmBox(title, html, yesLabel, cb) {
    $('ct-dlg-t').textContent = title;
    $('ct-dlg-c').innerHTML = html;
    $('ct-dlg-yes').textContent = yesLabel;
    onYes = cb; $('ct-mask').hidden = false;
  }
  $('ct-dlg-no').onclick = () => { $('ct-mask').hidden = true; onYes = null; };
  $('ct-dlg-yes').onclick = () => {
    const f = onYes, body = $('ct-dlg-c');
    $('ct-mask').hidden = true; onYes = null;
    if (f) f(body);                       // 다이얼로그 안 입력값을 읽을 수 있게 넘긴다
  };

  // ── 공통 조각 ──
  function card(title, badge, body, style) {
    return '<div class="pcard"' + (style || '') + '><div class="h">' +
      '<span style="font:600 11.5px var(--sans)">' + title + '</span>' + (badge || '') +
      '</div><div class="b">' + body + '</div></div>';
  }
  function sidePanel(nodeId, extra) {
    const locks = L.interlockOf(M, nodeId);
    return '<div class="ct-side">' +
      (extra || '') +
      (locks.length ? card('인터록',
        '<span class="tag ' + (L.interlockOk(M, nodeId) ? 'tl' : 'man') + '">' +
        locks.filter(i => i.ok).length + ' / ' + locks.length + ' 충족</span>',
        '<div style="display:flex;flex-direction:column;gap:4px">' +
        locks.map(i => '<label class="ct-lock">' +
          '<input type="checkbox" data-lock="' + esc(i.key) + '"' + (i.ok ? ' checked' : '') + '>' +
          '<span class="box ' + (i.ok ? 'ok' : 'no') + '">' + (i.ok ? '✓' : '!') + '</span>' +
          '<span' + (i.ok ? '' : ' style="color:#9C3D22"') + '>' + esc(i.label) + '</span></label>').join('') +
        '<span class="hint" style="margin-top:4px">미충족이면 판정 입력이 잠깁니다 (체크박스는 목업 확인용)</span></div>') : '') +
      card('명령 로그', '<span class="hint">command_log</span>',
        '<div style="display:flex;flex-direction:column">' +
        M.log.map(e => '<div class="logrow"><span>' + esc(e.ts) + '</span><b>' + esc(e.text) +
          '</b><span>' + esc(e.actor) + '</span></div>').join('') + '</div>',
        ' style="flex:1"') +
      '</div>';
  }
  const devPanel =
    '<details class="ct-dev"><summary>설비 명령 — 작업 흐름과 무관 (물리 동작)</summary>' +
    '<div class="b" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">' +
    '<button class="cmd phys">집진 ON</button><button class="cmd phys">집진 OFF</button>' +
    '<button class="cmd phys dis">작업대 조명</button></div></details>';

  // ══ 서브 메뉴 ══════════════════════════════════════════════
  function renderMenu() {
    const rows = L.fullMenu(M);
    if (!S.menu || !rows.some(r => r.menu_label === S.menu)) S.menu = rows[0] ? rows[0].menu_label : null;
    $('ct-menu').innerHTML = rows.map(r =>
      '<span class="ptab' + (r.menu_label === S.menu ? ' on' : '') + '" data-ctl-menu="' + esc(r.menu_label) + '">' +
      esc(r.menu_label) + (r.node_ids.length ? ' <span class="n">' + r.node_count + '</span>' : '') +
      '</span>').join('') +
      '<span class="sp" style="flex:1"></span>' +
      '<span class="hint" style="align-self:center">v_control_menu · 공정 순서대로</span>';
    return rows.find(r => r.menu_label === S.menu) || null;
  }

  function renderNodeBar(entry) {
    if (!entry || !entry.node_ids.length) {      // HOME 처럼 노드가 없는 화면
      $('ct-nodebar').innerHTML = entry
        ? '<span class="eyebrow">' + esc(entry.menu_label) + '</span>' +
          '<span class="ct-kind">' + esc(entry.ui_kind) + '</span>' +
          '<span class="sp"></span><span class="hint">공정 ' + entry.node_count + '종</span>'
        : '';
      S.node = null; return;
    }
    const ids = entry.node_ids;
    if (!S.node || ids.indexOf(S.node) < 0) { S.node = ids[0]; S.rack = null; S.slot = null; S.open = null; }
    const label = (id) => {
      const n = L.node(M, id);
      return n ? n.label : (M.transporters.find(t => t.transporter_id === id) || {}).label || id;
    };
    $('ct-nodebar').innerHTML =
      '<span class="eyebrow">' + esc(entry.menu_label) + '</span>' +
      '<span class="ct-kind">' + esc(entry.ui_kind) + '</span>' +
      (entry.ui_kind === 'MONITOR'
        ? '<span class="sel" style="margin-left:8px">설비 ' + ids.length + '대 · 한 화면</span>'
        : ids.length > 1
        ? '<div class="ct-states" style="margin-left:8px">' + ids.map(id =>
            '<span class="sel" data-ctl-node="' + esc(id) + '"' +
            (id === S.node ? ' style="background:var(--teal);border-color:var(--teal6);color:#fff"' : '') +
            '>' + esc(label(id)) + '</span>').join('') + '</div>'
        : '<span class="sel" style="margin-left:8px">' + esc(label(ids[0])) + '</span>') +
      '<span class="sp"></span>' +
      '<span class="hint">노드 ' + ids.length + '개 · 목업에 줄을 더하면 여기가 늘어납니다</span>';
  }

  // ══ 화면 A — BATCH_SPLIT ══════════════════════════════════
  function screenBatchSplit(nodeId) {
    const racks = L.prevRacks(M, nodeId);
    if (S.rack === null && racks.length) S.rack = racks[0].node_id;
    const slots = S.rack ? L.slotsOf(M, S.rack) : [];
    if (S.slot !== null && !slots.some(s => s.slot_no === S.slot && s.used > 0)) S.slot = null;
    const q = (S.rack && S.slot !== null) ? L.queueOf(M, S.rack, S.slot) : [];
    if (S.open && !q.some(b => b.unit_id === S.open)) S.open = null;
    if (!S.open) { const f = q.find(b => b.retrievable); if (f) S.open = f.unit_id; }

    // 1 · 2 랙 / 칸
    let left = '<div class="ct-left">';
    left += '<div><div class="ct-step"><i>1</i><b>랙 선택</b></div>';
    if (!racks.length) left += '<div class="hint">직전 공정 랙이 없습니다.</div>';
    else if (racks.length === 1) {
      const ld = L.rackLoad(M, racks[0].node_id);
      left += '<div class="ct-auto"><b>' + esc(racks[0].label) + '</b><br>' +
        '<span class="hint">적재 ' + ld.used + '/' + ld.capacity + ' · 칸 ' + ld.slots +
        '개 · 자동 선택됨</span></div>';
    } else {
      left += '<div class="ct-pick">' + racks.map(r => {
        const ld = L.rackLoad(M, r.node_id);
        return '<button data-rack="' + esc(r.node_id) + '"' + (r.node_id === S.rack ? ' class="on"' : '') + '>' +
          '<span class="n">' + esc(r.label) + '</span><span class="s">적재 ' + ld.used + '/' + ld.capacity +
          ' · 칸 ' + ld.slots + '개</span></button>';
      }).join('') + '</div>';
    }
    left += '</div>';
    left += '<div' + (slots.some(s => s.used) ? '' : ' class="ct-off"') + '>' +
      '<div class="ct-step"><i>2</i><b>칸 선택</b><span class="hint">' + slots.length + '칸</span></div>' +
      '<div class="ct-pick">' + slots.map(s =>
        '<button data-slot="' + s.slot_no + '"' + (s.used ? '' : ' disabled') +
        (s.slot_no === S.slot ? ' class="on"' : '') + '>' +
        '<span class="n">칸 ' + s.slot_no + ' · ' + s.used + '/' + s.capacity + '</span>' +
        '<span class="s">' + (s.used ? esc(s.contents.join(' → ')) : '비어 있음') + '</span></button>').join('') +
      '</div></div></div>';

    // 3 대기열
    let main = '<div class="ct-main"><div>' +
      '<div class="ct-step"><i>3</i><b>배치 대기열</b><span class="hint">' +
      (S.slot === null ? '' : '칸 ' + S.slot + ' · ' + q.length + '장 · FIFO 라 1번만 꺼낼 수 있습니다') +
      '</span></div>';
    main += S.slot === null
      ? '<div class="hint" style="padding:14px 0">칸을 고르면 배치가 나올 순서대로 표시됩니다.</div>'
      : '<div class="ct-q">' + q.map(b =>
          '<button data-batch="' + esc(b.unit_id) + '"' + (b.retrievable ? '' : ' disabled') +
          (b.unit_id === S.open ? ' class="on"' : '') + '>' +
          '<span class="p">' + (b.retrievable ? '▶' : '') + ' ' + b.pos_no + '</span>' +
          '<span class="d">' + esc(b.display_id) + '</span>' +
          '<span class="ct-mix">' +
            '<span class="ct-kinds">' + b.contents.length + '종</span>' +
            b.contents.map(c => '<span class="ct-chip">' + esc(c.part_no) +
              '<b>\u00d7' + c.qty + '</b></span>').join('') + '</span>' +
          '<span style="text-align:right">' + b.total_qty + '개</span>' +
          '<span class="lock" style="text-align:right">' +
          (b.retrievable ? '지금 작업' : '앞 배치 먼저') + '</span></button>').join('') + '</div>';
    main += '</div>';

    // 4 판정
    const lock = L.interlockOk(M, nodeId);
    main += '<div><div class="ct-step"><i>4</i><b>파트별 판정 · 배치 완료</b><span class="hint">';
    if (S.open) {
      const b = M.units.find(x => x.unit_id === S.open);
      const rows = L.judgeRows(M, b, S.judge[b.unit_id]);
      const t = L.totals(rows), can = L.canComplete(rows, lock);
      const un = L.untouched(rows, S.judge[b.unit_id]);
      const bad = L.badRows(rows);
      main += esc(b.display_id) + ' · 주문 ' + esc(b.order_id) + ' · 총 ' + t.qty + '개</span></div>';
      main += (!lock ? '<div class="ct-warn">인터록 미충족 — 판정 입력이 잠겨 있습니다.</div>' : '') +
        '<div style="display:flex;gap:8px;align-items:center;margin-bottom:9px">' +
        '<button class="cmd ct-big" id="ct-allok"' + (lock && un.kinds ? '' : ' disabled') + '>' +
        (un.kinds ? '남은 ' + un.kinds + '종 전체 OK (' + un.qty + '개)' : '전부 입력됨') + '</button>' +
        '<span class="hint" style="flex:1">이미 입력한 파트는 건드리지 않습니다. ' +
        '대부분 전부 OK 이고, NG 가 있을 때만 그 줄만 내리면 됩니다.</span></div>' +
        '<div class="ct-j' + (lock ? '' : ' ct-off') + '">' + rows.map((r, i) => {
          const bad = (+r.ok || 0) + (+r.ng || 0) !== r.qty;
          return '<div class="ct-jrow">' +
            '<div class="ct-cad">' + (r.cad_ref ? esc(r.cad_ref.replace(/\.[^.]+$/, '')) : '도면<br>없음') + '</div>' +
            '<div><div class="ct-pn">' + esc(r.part_no) + '</div><div class="ct-nm">' + esc(r.name) + '</div>' +
            '<div class="ct-sub">투입 ' + r.qty + '개' +
            (bad ? ' · <span class="ct-bad">합계가 맞지 않습니다</span>' : '') + '</div></div>' +
            '<div class="ct-cnt"><label>OK</label><input class="ct-num' + (bad ? ' bad' : '') +
            '" type="number" min="0" max="' + r.qty + '" value="' + (+r.ok || 0) + '" data-j="' + i + '" data-f="ok"></div>' +
            '<div class="ct-cnt"><label>NG</label><input class="ct-num ng' + (bad ? ' bad' : '') +
            '" type="number" min="0" max="' + r.qty + '" value="' + (+r.ng || 0) + '" data-j="' + i + '" data-f="ng"></div>' +
            (+r.ng > 0 ? '<div class="ct-reason"><span>NG ' + (+r.ng) + '개 사유</span>' +
              '<select data-j="' + i + '" data-f="reason"><option value="">- 선택 -</option>' +
              M.NG_REASONS.map(x => '<option' + (r.reason === x ? ' selected' : '') + '>' + esc(x) + '</option>').join('') +
              '</select>' + (r.reason ? '' : '<span class="hint">사유를 골라야 완료할 수 있습니다</span>') + '</div>' : '') +
            '</div>';
        }).join('') + '</div>' +
        (bad.length ? '<div class="ct-warn" style="margin-top:9px">' +
          bad.map(r => esc(r.part_no) + ' — ' +
            ((+r.ok || 0) + (+r.ng || 0) !== r.qty
              ? 'OK ' + (+r.ok || 0) + ' + NG ' + (+r.ng || 0) + ' = ' + ((+r.ok || 0) + (+r.ng || 0)) +
                ' (투입 ' + r.qty + ')'
              : 'NG 사유 미선택')).join('<br>') + '</div>' : '') +
        '<div style="display:flex;gap:8px;align-items:center;margin-top:10px">' +
        '<span class="hint" style="flex:1">합계 <b>OK ' + t.ok + '</b> · <b>NG ' + t.ng + '</b> / 총 ' + t.qty +
        '개 <span style="opacity:.7">— 참고용입니다. 검증은 파트별로 각각 합니다.</span></span>' +
        '<button class="cmd phys ct-big" id="ct-done"' + (can ? '' : ' disabled') + '>배치 완료 등록</button></div>';
    } else {
      main += '</span></div><div class="hint" style="padding:14px 0">대기열 1번 배치를 열면 파트별 판정이 나옵니다.</div>';
    }
    main += '</div>' + devPanel + '</div>';

    // 5 분리 완료 → 다음 노드. 여러 배치를 한 묶음에 모을 수 있다.
    const groups = L.groups(M, nodeId);
    const nexts = L.nextNodes(M, nodeId).filter(n => n.node_kind === 'STATION');
    const target = L.groupTarget(M, nodeId);
    let side = '<div><div class="ct-step"><i>5</i><b>분리 완료 · 넘기기</b></div>' +
      (groups.length ? groups.map(g => {
        const srcs = L.groupSources(M, nodeId, g.group_id);
        const open = g.group_id === S.openGroup;
        const full = target > 0 && g.units.length >= target;
        return card('묶음 ' + esc(g.group_id),
          '<span class="tag ' + (full ? 'man' : 'tl') + '">' + g.units.length +
          (target ? ' / ' + target : '') + '</span>',
          srcs.map(sc => '<div class="ct-src"><b>' + esc(sc.display_id) + '</b><span>' +
            Object.keys(sc.parts).map(pn => esc(pn) + ' ' + sc.parts[pn] + '개').join(' · ') +
            '</span></div>').join('') +
          (open
            ? '<div class="ct-note" style="margin-top:8px">다음 배치도 이 묶음에 담깁니다' +
              (target ? ' (남은 자리 ' + Math.max(0, target - g.units.length) + '개)' : '') + '.</div>' +
              '<button class="cmd" style="width:100%;margin-top:6px" id="ct-newgroup">새 묶음으로 시작</button>'
            : '') +
          (full ? '<div class="ct-warn" style="margin-top:6px">정원 ' + target +
            '개가 찼습니다 — 넘기고 새 묶음을 시작하세요.</div>' : '') +
          nexts.map(nx => '<button class="cmd phys" style="width:100%;margin-top:8px" ' +
            'data-handoff="' + esc(g.group_id) + '" data-to="' + esc(nx.node_id) + '">묶음 마감 · ' +
            esc(nx.label) + '로 넘기기</button>').join('') +
          '<span class="hint" style="display:block;margin-top:6px">묶음째 이동 1건입니다 (부품 ' +
          g.units.length + '건이 아닙니다). 물리 이동은 없습니다.</span>');
      }).join('')
        : '<div class="hint">배치를 완료하면 떼어낸 부품이 여기 묶음으로 쌓입니다.' +
          (target ? ' 정원 ' + target + '개(다음 설비 기준)까지 여러 배치를 모을 수 있습니다.' : '') +
          '</div>') +
      '</div>';

    return '<div class="ct-body">' + left + main + sidePanel(nodeId, side) + '</div>';
  }

  // ══ 화면 B — PART_JUDGE (서포트 제거 · 치수검사가 같이 쓴다) ══
  function screenPartJudge(nodeId) {
    const parts = L.waitingParts(M, nodeId);
    const spec = L.measureSpec(M, nodeId);
    const lock = L.interlockOk(M, nodeId);
    const nexts = L.nextNodes(M, nodeId);
    const boxRack = nexts.filter(n => n.node_kind === 'RACK' && n.count_by_group)[0] || null;

    const groups = L.groups(M, nodeId);
    let left = '<div class="ct-left"><div class="ct-step"><i>1</i><b>대기 묶음</b></div>' +
      (groups.length ? '<div class="ct-pick">' + groups.map(g =>
        '<button class="on"><span class="n">' + esc(g.group_id) + '</span>' +
        '<span class="s">' + g.units.length + '개 대기</span></button>').join('') + '</div>'
        : '<div class="hint">대기 중인 부품이 없습니다.</div>') +
      (spec ? '<div class="ct-note">측정 스펙이 있는 노드라 판정에 <b>' + esc(spec.label) +
        '</b> 입력란이 추가됩니다. 화면 종류는 서포트 제거와 같습니다.</div>' : '') +
      '</div>';

    const decided = parts.filter(p => L.latestVerdict(M, p.unit_id)).length;
    let main = '<div class="ct-main"><div>' +
      '<div class="ct-step"><i>2</i><b>부품별 판정</b><span class="hint">대기 ' + parts.length +
      '개 · 판정 ' + decided + '개' + (spec ? ' · 측정값 입력' : '') + '</span></div>' +
      (!lock ? '<div class="ct-warn">인터록 미충족 — 판정 입력이 잠겨 있습니다.</div>' : '') +
      '<div style="display:flex;gap:8px;align-items:center;margin-bottom:9px">' +
      '<button class="cmd ct-big" id="ct-allok-part"' + (lock && parts.length ? '' : ' disabled') +
      '>일괄 · 남은 부품 전체 OK</button>' +
      '<span class="hint" style="flex:1">파트넘버로 정렬돼 있습니다 — 같은 모양끼리 붙어 있습니다.</span></div>';

    if (!parts.length) main += '<div class="ct-empty">판정할 부품이 없습니다.</div>';
    else {
      const cols = spec ? '38px 1fr 130px 110px 150px' : '38px 1fr 130px 150px';
      main += '<div class="ct-parts' + (lock ? '' : ' ct-off') + '" style="grid-template-columns:' + cols + '">' +
        '<span class="hd">#</span><span class="hd">부품</span><span class="hd">파트넘버</span>' +
        (spec ? '<span class="hd">' + esc(spec.label) + ' (' + esc(spec.unit) + ')</span>' : '') +
        '<span class="hd">판정</span>' +
        parts.map((p, i) => {
          const v = L.latestVerdict(M, p.unit_id);
          const mv = S.measure[p.unit_id];
          const tol = L.inTolerance(mv, p.attrs);
          return '<span class="no">' + String(i + 1).padStart(2, '0') + '</span>' +
            '<span class="uid">' + esc(p.display_id) + '</span>' +
            '<span>' + esc(p.part_no) + '<span class="hint" style="margin-left:5px">' + esc(p.part_name) + '</span></span>' +
            (spec ? '<span><input class="ct-meas' + (tol === false ? ' out' : '') + '" type="number" step="0.01" ' +
              'data-meas="' + esc(p.unit_id) + '" value="' + (mv == null ? '' : mv) + '" placeholder="' +
              (p.attrs.nominal_mm == null ? '' : p.attrs.nominal_mm) + '">' +
              (p.attrs.tol_mm != null ? '<span class="hint" style="margin-left:4px">±' + p.attrs.tol_mm + '</span>' : '') +
              '</span>' : '') +
            '<span><span class="ct-states">' +
            '<button class="vbtn ok' + (v && v.verdict === 'OK' ? ' on' : '') + '" data-v="OK" data-u="' + esc(p.unit_id) + '">OK</button>' +
            '<button class="vbtn ng' + (v && v.verdict === 'NG' ? ' on' : '') + '" data-v="NG" data-u="' + esc(p.unit_id) + '">NG</button>' +
            '</span></span>';
        }).join('') + '</div>';
    }
    main += '</div>' + devPanel + '</div>';

    // 3 다음 공정 — 판정한 부품은 박스에 담기고, 다음 설비는 그 박스를 큐에서 가져간다
    let side = '<div><div class="ct-step"><i>3</i><b>다음 공정</b></div>';
    if (boxRack) {
      const box = L.openBox(M, boxRack.node_id);
      const cap = L.groupCapacity(boxRack), n = box.items.length;
      side += card('박스 적재 → ' + esc(boxRack.label), '<span class="tag tl">' + n + ' / ' + cap + '</span>',
        '<div class="ct-note">OK 판정한 부품은 박스에 하나씩 담깁니다 (join_group). ' + cap +
        '개가 차면 자동 마감됩니다.</div>' +
        '<div class="ct-grid">' + Array.from({ length: cap }, (_, i) =>
          '<i class="' + (i < n ? 'f' : '') + '"></i>').join('') + '</div>' +
        '<div class="ct-from">' + (n ? '<span>' + esc(box.group_id) + ' · ' + n + '개</span>'
                                       : '<span>비어 있음</span>') + '</div>' +
        '<button class="cmd" style="width:100%;margin-top:8px" id="ct-closebox"' + (n ? '' : ' disabled') +
        '>박스 수동 마감</button>');
    }
    side += '</div>';

    return '<div class="ct-body">' + left + main + sidePanel(nodeId, side) + '</div>';
  }

  // ══ 화면 C — MONITOR ══════════════════════════════════════
  // 이 메뉴에 묶인 설비를 전부 블록으로 편다. 블록마다 상태 + 시작 · 중지 · 완료.
  function screenMonitor(_nodeId, entry) {
    const ids = (entry && entry.node_ids.length ? entry.node_ids : [_nodeId]).filter(Boolean);

    // 같은 탭 안에서도 공정끼리는 나눠 보인다 (group_label 이 소제목)
    const groups = [];
    ids.map(id => L.node(M, id)).filter(Boolean).forEach(n => {
      const g = n.group_label || n.label;
      let row = groups.find(x => x.label === g);
      if (!row) groups.push(row = { label: g, nodes: [] });
      row.nodes.push(n);
    });

    const block = (n) => {
      const here = L.at(M, n.node_id);
      const q = L.inbound(M, n.node_id);
      const pick = q.find(r => r.key === S.pick && r.ready) || q.find(r => r.ready) || null;
      const u = here[0] || null;
      const bd = L.stateBadge(M, n.node_id);
      const pct = L.progress(M, n);
      const inb = L.inbound(M, n.node_id);
      const inbQty = inb.reduce((a, r) => a + r.qty, 0);
      return '<div class="ct-eq ' + (u ? (u.status === 'RUN' ? 'run' : '') : 'idle') +
        '" data-eq="' + esc(n.node_id) + '">' +
        '<div class="h"><b>' + esc(n.label) + '</b>' +
        '<span class="tag ' + bd.tone + '">' + esc(bd.text) + '</span></div>' +
        '<div class="s">' +
        (u ? '<b>' + (here.length > 1 ? here.length + '개' : esc(u.display_id)) + '</b> · ' +
             esc(here.length > 1 ? L.occupancy(M, n) + '개 적재' : L.mixOf(u)) + '<br>' +
             '경과 ' + L.fmt(u.elapsed_s) +
             (u.plan_s ? ' / 설정 ' + L.fmt(u.plan_s) : ' / 표준 ' + L.fmt(n.std_cycle_s))
           : '비어 있음 · 표준 ' + L.fmt(n.std_cycle_s)) +
        '</div>' +
        (pct != null
          ? '<div class="track"><i style="width:' + pct + '%"></i><b style="left:' + pct + '%"></b></div>'
          : '<div class="track"><i style="width:0%"></i></div>') +
        '<div class="q"><span class="rowlbl">대기 큐 ' + inb.length + '건' +
        (inbQty ? ' · ' + inbQty + '개' : '') + '</span>' +
        '<span class="hint">' + (pick && !u ? '다음 투입 <b>' + esc(pick.label) + '</b>'
                                            : (inb.length ? '왼쪽에서 고릅니다' : '없음')) + '</span></div>' +
        // 비어 있으면 큐에서 넣는 것이 먼저다. 차 있으면 시작 · 중지 · 완료.
        (u ? '<div class="a">' + L.CMD.map(c =>
              '<button class="cmd phys" data-cmd="' + c.key + '" data-n="' + esc(n.node_id) + '"' +
              (L.canCmd(M, n.node_id, c.key) ? '' : ' disabled') + '>' + c.label + '</button>').join('') +
             '</div>'
           : '<div class="a" style="grid-template-columns:1fr">' +
             '<button class="cmd phys" data-load="' + esc(n.node_id) + '"' +
             (pick ? '' : ' disabled') + '>' +
             (pick ? esc(pick.label) + ' 투입' : '투입할 것 없음') + '</button></div>') +
        '</div>';
    };

    // 이 메뉴가 받는 대기 큐 — 설비가 여럿이어도 들어오는 줄은 같다
    const queue = [];
    ids.forEach(id => L.inbound(M, id).forEach(r => {
      if (!queue.some(x => x.key === r.key)) queue.push(r);
    }));
    if (!queue.some(r => r.key === S.pick && r.ready)) {
      const f = queue.find(r => r.ready); S.pick = f ? f.key : null;
    }
    let left = '<div class="ct-left">' +
      '<div class="ct-step"><i>1</i><b>투입 대기 큐</b><span class="hint">' + queue.length + '건</span></div>' +
      (queue.length
        ? '<div class="ct-pick">' + queue.map((r, i) =>
            '<button data-pick="' + esc(r.key) + '"' + (r.ready ? '' : ' disabled') +
            (r.key === S.pick ? ' class="on"' : '') + '>' +
            '<span class="n">' + (i + 1) + ' · ' + esc(r.label) + '</span>' +
            '<span class="s">' + r.qty + '개 · ' + esc(r.from) +
            (r.ready ? '' : ' · 앞의 것 먼저') + '</span></button>').join('') + '</div>'
        : '<div class="hint">들어올 것이 없습니다. 앞 공정에서 넘기면 여기 순서대로 쌓입니다.</div>') +
      '<div class="ct-note">위에서 하나를 고르고, 비어 있는 설비의 <b>투입</b>을 누르면 들어갑니다. ' +
      '출처마다 맨 앞의 것부터 나갑니다 (FIFO).</div></div>';

    const running = ids.filter(id => (L.at(M, id)[0] || {}).status === 'RUN').length;
    let main = '<div class="ct-main">' +
      '<div class="ct-step"><i>2</i><b>설비 상태 · 명령</b>' +
      '<span class="hint">설비 ' + ids.length + '대 · 가동 ' + running + '대 · 관측 자동 갱신</span></div>' +
      groups.map(g =>
        '<div><div class="eyebrow" style="margin-bottom:6px">' + esc(g.label) +
        ' <span class="hint">' + g.nodes.length + '대</span></div>' +
        '<div class="ct-eqgrid">' + g.nodes.map(block).join('') + '</div></div>').join('') +
      '<span class="hint">시작 · 중지 · 완료는 설비로 나가는 명령입니다. ' +
      'product_event 에 source=MANUAL 로 남습니다.</span>' +
      '</div>';

    return '<div class="ct-body">' + left + main + sidePanel(ids[0], '') + '</div>';
  }
  function fld(l, v, u) {
    return '<div class="fld"><span class="l">' + l + '</span><div class="inp">' + v +
      (u ? '<span class="u">' + u + '</span>' : '') + '</div></div>';
  }

  // ══ 화면 D — TRANSPORT ════════════════════════════════════
  function screenTransport(id) {
    const t = M.transporters.find(x => x.transporter_id === id) || M.transporters[0];
    let main = '<div class="ct-main"><div>' +
      '<div class="ct-step"><i>1</i><b>' + esc(t.label) + '</b>' +
      '<span class="hint">' + (t.auto_dispatch ? '자동 배정' : '수동 반송') + '</span></div>' +
      '<div class="ct-facts">' +
      fld('상태', esc(t.status), '') + fld('적재물', esc(t.unit || '빈손'), '') +
      fld('구간', esc((t.from_node || '-') + ' → ' + (t.to_node || '-')), '') +
      fld('대기 큐', t.queue_len, '건') + '</div></div>' +
      '<div><div class="ct-step"><i>2</i><b>수동 조작</b></div>' +
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">' +
      '<button class="cmd phys">원점 복귀</button><button class="cmd phys">그리퍼 열기</button>' +
      '<button class="cmd phys">그리퍼 닫기</button></div></div></div>';
    return '<div class="ct-body">' + main + sidePanel(t.transporter_id, '') + '</div>';
  }

  // ══ 화면 E — HOME (랜딩) ══════════════════════════════════
  function screenHome() {
    const rows = L.menu(M);
    return '<div style="padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;' +
      'background:var(--n25)">' + rows.map(r => {
        const nodes = r.node_ids.map(id => L.node(M, id));
        const busy = nodes.filter(nd => !L.isFree(M, nd)).length;
        const chips = nodes.map(nd => '<span class="uchip ' + (L.isFree(M, nd) ? 'free' : 'busy') + '">' +
          esc(nd.label) + '</span>').join('');
        return '<div class="pcard"><div class="h">' +
          '<span style="font:600 12px var(--sans)">' + esc(r.menu_label) + '</span>' +
          '<span class="ct-kind">' + esc(r.ui_kind) + '</span>' +
          '<span class="sp" style="flex:1"></span>' +
          '<span class="tag tl">' + r.node_count + '대</span></div>' +
          '<div class="b"><div class="unitchips">' + chips + '</div>' +
          '<div class="fld"><span class="l">가동 / 대기</span>' +
          '<div class="inp">' + busy + ' / ' + (r.node_count - busy) + '<span class="u">대</span></div></div>' +
          '<button class="cmd" style="width:100%" data-ctl-menu="' + esc(r.menu_label) + '">열기</button>' +
          '</div></div>';
      }).join('') +
      '<div class="pcard" style="grid-column:1/-1;border-style:dashed"><div class="b">' +
      '<span class="hint" style="line-height:1.7">이 목록은 <b>v_control_menu</b> 에서 나옵니다 — ' +
      'group_label 로 묶고 공정 순서대로. 설비를 늘리면 대수가, 새 공정을 넣으면 카드가 늘어납니다. ' +
      '화면은 <b>ui_kind</b> 로만 갈립니다 (공정 타입으로 갈리지 않습니다).</span></div></div></div>';
  }

  // ══ 화면 분기 — ui_kind 로만 ══════════════════════════════
  const SCREENS = {
    HOME: screenHome,
    BATCH_SPLIT: screenBatchSplit,
    PART_JUDGE: screenPartJudge,
    MONITOR: screenMonitor,
    TRANSPORT: screenTransport
  };

  function render() {
    const entry = renderMenu();
    renderNodeBar(entry);
    if (!entry) { $('ct-screen').innerHTML = '<div class="ct-empty">제어할 설비가 없습니다.</div>'; return; }
    const fn = SCREENS[entry.ui_kind];
    $('ct-screen').innerHTML = fn
      ? '<div data-screen="' + esc(entry.ui_kind) + '" data-node="' + esc(S.node || '') + '">' +
        fn(S.node, entry) + '</div>'
      : '<div class="ct-empty">이 화면 종류(' + esc(entry.ui_kind) + ')는 아직 없습니다.</div>';
  }

  // ══ 조작 ══════════════════════════════════════════════════
  const root = $('ct-menu').closest('.wf') || document;

  root.addEventListener('click', (e) => {
    const mn = e.target.closest('[data-ctl-menu]');
    if (mn) { S.menu = mn.dataset.ctlMenu; S.node = null; S.rack = null; S.slot = null; S.open = null; render(); return; }
    const nd = e.target.closest('[data-ctl-node]');
    if (nd) { S.node = nd.dataset.ctlNode; S.rack = null; S.slot = null; S.open = null; render(); return; }
    const rk = e.target.closest('[data-rack]');
    if (rk) { S.rack = rk.dataset.rack; S.slot = null; S.open = null; render(); return; }
    const sl = e.target.closest('[data-slot]');
    if (sl) { S.slot = +sl.dataset.slot; S.open = null; render(); return; }
    const ba = e.target.closest('[data-batch]');
    if (ba) { S.open = ba.dataset.batch; render(); return; }

    if (e.target.id === 'ct-allok') {
      const b = M.units.find(x => x.unit_id === S.open);
      const saved = S.judge[b.unit_id] = S.judge[b.unit_id] || {};
      // 🔴 이미 손댄 파트는 덮지 않는다. A형에 NG 2 를 넣고 일괄을 눌러도 A형은 그대로.
      L.untouched(L.judgeRows(M, b, saved), saved).parts
        .forEach(r => { saved[r.part_no] = { ok: r.qty, ng: 0, reason: '' }; });
      render(); return;
    }
    if (e.target.id === 'ct-done') { askSplit(); return; }

    if (e.target.id === 'ct-newgroup') { S.openGroup = null; log('BOX_CLOSE', '새 묶음으로 전환'); render(); return; }

    const ho = e.target.closest('[data-handoff]');
    if (ho) { askHandoff(ho.dataset.handoff, ho.dataset.to); return; }

    const vb = e.target.closest('[data-v]');
    if (vb) { onVerdict(vb.dataset.u, vb.dataset.v); return; }

    if (e.target.id === 'ct-allok-part') {
      L.waitingParts(M, S.node).forEach(p => {
        if (!L.latestVerdict(M, p.unit_id)) L.judge(M, p.unit_id, S.node, 'OK', measureValue(p), null);
      });
      log('JUDGE', '남은 부품 전체 OK');
      render(); return;
    }
    if (e.target.id === 'ct-closebox') { askCloseBox(); return; }

    const pk = e.target.closest('[data-pick]');
    if (pk) { S.pick = pk.dataset.pick; render(); return; }
    const ld = e.target.closest('[data-load]');
    if (ld) { askLoad(ld.dataset.load); return; }
    const cm = e.target.closest('[data-cmd]');
    if (cm) { askCmd(cm.dataset.n, cm.dataset.cmd); return; }
  });

  root.addEventListener('change', (e) => {
    const lk = e.target.closest('[data-lock]');
    if (lk) {
      const arr = L.interlockOf(M, S.node);
      const it = arr.find(i => i.key === lk.dataset.lock);
      if (it) it.ok = lk.checked;
      render(); return;
    }
    const ms = e.target.closest('[data-meas]');
    if (ms) { S.measure[ms.dataset.meas] = ms.value === '' ? null : +ms.value; render(); return; }

    const j = e.target.closest('[data-j]');
    if (!j) return;
    const b = M.units.find(x => x.unit_id === S.open);
    const rows = L.judgeRows(M, b, S.judge[b.unit_id]);
    const r = rows[+j.dataset.j], f = j.dataset.f;
    if (f === 'reason') r.reason = j.value;
    else {
      const v = Math.max(0, Math.min(r.qty, +j.value || 0));
      r[f] = v;
      if (f === 'ng') { r.ok = r.qty - v; if (!v) r.reason = ''; }
    }
    // 🔴 고친 줄만 저장한다. 전부 저장하면 "아직 안 건드린 파트"가 사라져
    //    일괄 OK 가 대상을 못 찾는다 (A형만 만졌는데 B·C 도 손댄 것으로 잡힌다).
    S.judge[b.unit_id] = S.judge[b.unit_id] || {};
    S.judge[b.unit_id][r.part_no] = { ok: r.ok, ng: r.ng, reason: r.reason };
    render();
  });

  function measureValue(p) {
    const spec = L.measureSpec(M, S.node);
    if (!spec) return null;
    const v = S.measure[p.unit_id];
    return v == null ? null : { [spec.key]: v, tol: p.attrs.tol_mm, nominal: p.attrs.nominal_mm };
  }

  function onVerdict(unitId, verdict) {
    const p = L.waitingParts(M, S.node).find(x => x.unit_id === unitId);
    if (!p) return;
    if (verdict === 'NG') {
      confirmBox('NG 판정 — ' + p.display_id,
        '<b>' + esc(p.display_id) + ' 을(를) 폐기 처리합니다.</b><br>' +
        '<span class="hint">judgement 에 NG 가 기록되고 part_scrap 으로 라인을 떠납니다. 목록에서 빠집니다.</span>',
        'NG 확정', () => {
          L.judge(M, unitId, S.node, 'NG', measureValue(p), null);
          L.scrapPart(M, unitId, S.node, '판정 NG');
          log('JUDGE', esc(p.display_id) + ' NG · 폐기');
          render();
        });
      return;
    }
    L.judge(M, unitId, S.node, 'OK', measureValue(p), null);
    log('JUDGE', esc(p.display_id) + ' OK');
    render();
  }

  function askSplit() {
    const b = M.units.find(x => x.unit_id === S.open);
    const rows = L.judgeRows(M, b, S.judge[b.unit_id]);
    const t = L.totals(rows);
    const target = L.groupTarget(M, S.node);
    const fits = S.openGroup && (!target || L.groupCount(M, S.node, S.openGroup) + t.ok <= target);
    confirmBox('배치 완료 등록 — ' + b.display_id,
      '<b>OK ' + t.ok + '개가 부품으로 등록됩니다.' + (t.ng ? ' NG ' + t.ng + '개는 폐기 처리됩니다.' : '') + '</b>' +
      '<div style="margin:8px 0;display:flex;flex-direction:column;gap:2px">' +
      rows.map(r => '<span style="font:400 11.5px var(--sans)"><b style="font-family:var(--mono)">' +
        esc(r.part_no) + '</b> &nbsp;OK ' + (+r.ok || 0) + ' / NG ' + (+r.ng || 0) +
        (+r.ng ? ' <span style="color:#9C3D22">(' + esc(r.reason) + ')</span>' : '') + '</span>').join('') +
      '</div>' +
      '<span class="hint">Split 발행 · 부품이 ' + esc(b.display_id) + '-S... 로 태어나 ' +
      (fits ? '묶음 <b>' + esc(S.openGroup) + '</b> 에 이어 담깁니다'
            : (S.openGroup ? '<b>새 묶음</b>에 담깁니다 (' + esc(S.openGroup) + ' 정원 ' + target + '개를 넘습니다)'
                           : '<b>새 묶음</b>에 담깁니다')) +
      '. 되돌릴 수 없습니다.</span>',
      '배치 완료', () => {
        // 열린 묶음에 담되, 정원을 넘기면 새 묶음을 딴다 (경화기에 안 들어간다)
        let gid = S.openGroup;
        if (gid && target && L.groupCount(M, S.node, gid) + t.ok > target) gid = null;
        const r = L.splitBatch(M, b, rows, S.node, gid);
        S.openGroup = r.group_id;
        if (target && L.groupCount(M, S.node, r.group_id) >= target) S.openGroup = null;  // 정원 참
        delete S.judge[b.unit_id]; S.open = null;
        log('JUDGE', esc(b.display_id) + ' 분리 완료 (OK ' + r.ok + (r.ng ? ' / NG ' + r.ng : '') +
          ') → ' + r.group_id);
        render();
      });
  }

  function askHandoff(groupId, toNodeId) {
    const to = L.node(M, toNodeId);
    const g = L.groups(M, S.node).find(x => x.group_id === groupId);
    confirmBox('다음 단계로 넘기기 — ' + to.label,
      '<b>' + esc(groupId) + ' (' + g.units.length + '개) 를 ' + esc(to.label) + ' 로 넘깁니다.</b><br>' +
      '<span class="hint">같은 작업대라 물리 이동은 없습니다. Moved 는 묶음째 1건입니다.</span>',
      '넘기기', () => {
        const r = L.moveGroup(M, groupId, S.node, toNodeId);
        if (S.openGroup === groupId) S.openGroup = null;
        log('MOVED', esc(groupId) + ' → ' + esc(to.label) + ' (' + r.count + '개)');
        render();
      });
  }

  function askLoad(nodeId) {
    const n = L.node(M, nodeId);
    const q = L.inbound(M, nodeId);
    const row = q.find(r => r.key === S.pick && r.ready) || q.find(r => r.ready);
    if (!n || !row) return;
    confirmBox('투입 — ' + n.label,
      '<b>' + esc(row.label) + ' (' + row.qty + '개) 를 ' + esc(n.label) + ' 에 넣습니다.</b><br>' +
      '<span class="hint">' + esc(row.from) + ' 에서 옵니다. 넣고 나서 시작을 눌러야 돌아갑니다.</span>',
      '투입', () => {
        const r = L.loadInto(M, nodeId, row.key);
        if (r) { S.pick = null; log('MOVED', esc(r.label) + ' → ' + esc(n.label) + ' 투입 (' + r.count + '개)'); }
        render();
      });
  }

  function askCmd(nodeId, key) {
    const n = L.node(M, nodeId), c = L.cmdOf(key), here = L.at(M, nodeId), u = here[0];
    if (!n || !c || !u) return;
    // 가동 시간을 받는 설비는 시작할 때만 입력란이 붙는다 (노드의 duration_input 이 정한다)
    const spec = key === 'start' ? L.durationSpec(M, nodeId) : null;
    confirmBox(c.label + ' — ' + n.label,
      '<b>' + esc(n.label) + ' 에 ' + c.label + ' 명령을 보냅니다.</b><br>' +
      '<span class="hint">' + esc(here.length > 1 ? here.length + '개 적재분' : u.display_id) +
      ' · 상태 ' + esc(u.status) + ' → ' + c.to + '. 설비가 실제로 움직입니다.</span>' +
      (spec ? '<div class="fld" style="margin-top:11px"><span class="l">' + esc(spec.label) +
        ' <em>· 표준 ' + spec.default + esc(spec.unit) + '</em></span>' +
        '<div class="inp"><input id="ct-run-min" class="ct-meas" style="width:84px;text-align:left" ' +
        'type="number" min="1" step="1" value="' + spec.default + '">' +
        '<span class="u">' + esc(spec.unit) + '</span></div></div>' : ''),
      c.label, (body) => {
        const el = spec && body.querySelector('#ct-run-min');
        const ev = L.runCmd(M, nodeId, key, el ? el.value : null);
        if (!ev) { log('CMD', esc(n.label) + ' ' + c.label + ' 실패 — 가동 시간을 정해야 합니다'); render(); return; }
        log('CMD', esc(n.label) + ' ' + c.label +
          (ev.plan_s && key === 'start' ? ' ' + L.fmt(ev.plan_s) : '') +
          ' (' + ev.from + ' → ' + ev.to + ')');
        render();
      });
  }

  const boxRackId = (nodeId) => {
    const r = L.nextNodes(M, nodeId).filter(n => n.node_kind === 'RACK' && n.count_by_group)[0];
    return r ? r.node_id : null;
  };

  function askCloseBox() {
    const rackId = boxRackId(S.node);
    const box = L.openBox(M, rackId);
    const n = box.items.length, id = box.group_id;
    confirmBox('박스 수동 마감 — ' + id,
      '<b>' + esc(id) + ' 를 ' + n + '개로 마감합니다.</b><br>' +
      '<span class="hint">미달 상태로 다음 공정에 보냅니다. 새 박스가 열립니다.</span>',
      '마감', () => {
        const c = L.closeBox(M, rackId);
        if (c) log('BOX_CLOSE', esc(c.group_id) + ' 수동 마감 (' + c.items.length + '개)');
        render();
      });
  }

  // 판정 OK 가 박스로 가는 노드에서는 OK 즉시 박스에 담는다
  const _judge = L.judge;
  L.judge = function (m, unitId, nodeId, verdict, value, note) {
    const rec = _judge(m, unitId, nodeId, verdict, value, note);
    if (verdict === 'OK') {
      const boxRack = L.nextNodes(m, nodeId).filter(n => n.node_kind === 'RACK' && n.count_by_group)[0];
      if (boxRack) {
        L.joinBox(m, unitId, boxRack.node_id);
        if (L.openBox(m, boxRack.node_id).items.length >= L.groupCapacity(boxRack)) {
          const c = L.closeBox(m, boxRack.node_id);
          if (c) log('BOX_CLOSE', c.group_id + ' 자동 마감 (' + c.items.length + '개)');
        }
      }
    }
    return rec;
  };

  render();
})();
</script>
